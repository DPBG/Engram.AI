# Snyk security scanning (Snyk Code SAST + Open Source + IaC + Container).
#
# Snyk needs an API token. To avoid hard-failing every PR when it isn't
# provisioned (401 Unauthorized), the job SKIPS cleanly when the SNYK_TOKEN
# secret is absent — the same "skip when unconfigured" pattern deploy.yml uses
# for HETZNER_IP. Add a SNYK_TOKEN repo secret (https://snyk.io, free tier) to
# activate the scans. Findings are advisory (continue-on-error); the Snyk Code
# SARIF is uploaded to the Security tab.
#
# This workflow uses actions that are not certified by GitHub. They are provided
# by a third-party and governed by separate terms of service.

name: Snyk Security

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    env:
      # Job-scoped so the gate step can read it (the original sample scoped it to
      # the setup step only, so the scan steps never saw the token).
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Snyk token
        id: gate
        run: |
          if [ -n "${SNYK_TOKEN}" ]; then
            echo "SNYK_TOKEN present — running Snyk scans."
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "No SNYK_TOKEN secret configured — skipping Snyk (advisory, not a build failure)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Snyk CLI to check for security issues
        if: steps.gate.outputs.enabled == 'true'
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb

      # Snyk Code (SAST) → SARIF. Advisory: findings don't break the build; the
      # SARIF is surfaced in the Security tab by the upload step below.
      - name: Snyk Code test
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        run: snyk code test --sarif > snyk-code.sarif

      # Snyk Open Source (SCA) — reports dependency vulnerabilities to Snyk.
      - name: Snyk Open Source monitor
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        run: snyk monitor --all-projects

      # Snyk Infrastructure as Code.
      - name: Snyk IaC test and report
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        run: snyk iac test --report

      # Container scan. NOTE: replace `your/image-to-test` with a real image
      # (e.g. build a service via the compose build args) before relying on this.
      - name: Build a Docker image
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        run: docker build -t your/image-to-test .
      - name: Snyk Container monitor
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        run: snyk container monitor your/image-to-test --file=Dockerfile

      # Push the Snyk Code results into the GitHub Code Scanning tab.
      - name: Upload result to GitHub Code Scanning
        if: ${{ steps.gate.outputs.enabled == 'true' && hashFiles('snyk-code.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
