name: Notify on CI failure

# Closes the blind spot where the Tests gate can sit red without anyone noticing.
# When Tests fails on an integration/release branch, open (or update) a tracking
# issue. Uses only the built-in GITHUB_TOKEN — no Slack/Discord webhook secret.
#
# workflow_run workflows always run from the DEFAULT branch's definition, so this
# only takes effect once merged to `dev`.

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [dev, main]

permissions:
  contents: read
  issues: write

jobs:
  open-issue:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the CI failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = `CI red on ${run.head_branch}: ${run.name}`;
            const body = [
              `The **${run.name}** workflow failed on \`${run.head_branch}\`.`,
              ``,
              `- Commit: \`${run.head_sha}\``,
              `- Run: ${run.html_url}`,
              `- Author: @${(run.head_commit && run.head_commit.author && run.head_commit.author.name) || 'unknown'}`,
            ].join('\n');
            const label = 'ci-failure';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 50,
            });
            const match = existing.data.find((i) => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }
