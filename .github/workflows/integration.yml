name: Integration smoke

# Advisory (non-blocking) stack integration check. Unit suites cover services in
# isolation; this boots a real JetStream-enabled NATS server and drives an SDK
# EventBus publish -> subscribe round-trip — the wiring every service relies on.
#
# It is intentionally NOT part of the `ci-success` gate yet: promote it to
# required in branch protection once it has proven stable.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stack-smoke:
    name: NATS stack round-trip (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Engram CI env (uv + Python + nats-server)
        uses: ./.github/actions/setup-engram
        with:
          python-version: "3.12"
          nats: "true"

      - name: Start NATS with JetStream
        run: |
          set -euo pipefail
          nats-server -js -p 4222 -m 8222 >/tmp/nats.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8222/healthz >/dev/null; then
              echo "nats-server is up"; exit 0
            fi
            sleep 0.5
          done
          echo "nats-server did not become healthy" >&2
          cat /tmp/nats.log >&2 || true
          exit 1

      - name: SDK EventBus round-trip
        env:
          NATS_URL: nats://127.0.0.1:4222
        run: uv run --no-project --with-editable ./sdk python sdk/tests/integration/stack_smoke.py

      - name: Dump NATS log on failure
        if: failure()
        run: cat /tmp/nats.log || true
