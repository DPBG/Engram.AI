name: Bug Report
description: Report a defect in Engram
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the
        sections below so we can reproduce and fix the issue quickly.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the system is affected?
      options:
        - neuromorphic (spiking neural network core)
        - sdk (activelearning package)
        - dashboard
        - sensory-gateway
        - kernel / safety-supervisor (safety layer)
        - coordinator / meta-programmer / beliefs
        - brain-viz
        - deploy / docker / run.py
        - docs
        - other / not sure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Run `python run.py --only dashboard`
        2. Open http://localhost:8080
        3. Click on ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages and logs.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, how you are running Engram (pure Python vs Docker), and relevant hardware (CPU/RAM/GPU).
      placeholder: |
        - OS: Ubuntu 24.04
        - Python: 3.11.7
        - Run mode: python run.py (no Docker)
        - Hardware: 16-core / 64 GB RAM / no GPU
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am running the latest `main` (or I have stated my version/commit).
          required: true
