# NATS broker config for CI red-team authz tests (E1.1.9).
#
# Mirrors ADR 0001 privileged-subject rules using static per-service users.
# Production will move to decentralized JWT creds (E1.1.2+); this transitional
# layout is explicitly allowed by ADR 0001 for test/enforcement bring-up.
#
# Passwords are test-only fixtures — never use in production.

listen: 127.0.0.1:4222
http: 127.0.0.1:8222

jetstream {
}

authorization {
  users = [
    {
      user: kernel
      password: engram-test-kernel
      permissions: {
        publish: [
          "decision.>",
          "code.decision.>",
          "policy.*",
          "policy.*.status",
          "cognitive.response.validated",
          "_INBOX.>"
        ]
        subscribe: [">"]
      }
    }
    {
      user: coordinator
      password: engram-test-coordinator
      permissions: {
        publish: [
          "proposal.new",
          "task.request",
          "task.result",
          "_INBOX.>"
        ]
        subscribe: [">"]
      }
    }
    {
      user: meta
      password: engram-test-meta
      permissions: {
        publish: [
          "code.proposal",
          "knowledge.gap",
          "_INBOX.>"
        ]
        subscribe: [">"]
      }
    }
    {
      user: planner
      password: engram-test-planner
      permissions: {
        publish: [
          "observation.*",
          "_INBOX.>"
        ]
        subscribe: [">"]
      }
    }
  ]
}
