# Production override for the ~1M-neuron Hetzner deployment.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.1m.yml up -d
#
# Prerequisites — generate per-service NATS passwords once per deployment:
#
#   export KERNEL_NATS_PASS=$(openssl rand -hex 32)
#   export SAFETY_SUPERVISOR_NATS_PASS=$(openssl rand -hex 32)
#   export BELIEFS_NATS_PASS=$(openssl rand -hex 32)
#   export OVERRIDES_NATS_PASS=$(openssl rand -hex 32)
#
# Store these in your deployment secrets manager or a gitignored .env file.
# All four must be set; the broker will reject services that present an unknown
# password (fail-closed per ADR 0001-nats-authz.md §6).
#
# Services without dedicated credentials (neuromorphic, planner, etc.) connect
# as the no_auth_user (dev_default in nats-1m.conf) which denies publish on
# privileged governance subjects.

services:
  nats:
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      # Broker reads these variables to expand $*_NATS_PASS in nats-1m.conf.
      KERNEL_NATS_PASS: ${KERNEL_NATS_PASS:?KERNEL_NATS_PASS must be set}
      SAFETY_SUPERVISOR_NATS_PASS: ${SAFETY_SUPERVISOR_NATS_PASS:?SAFETY_SUPERVISOR_NATS_PASS must be set}
      BELIEFS_NATS_PASS: ${BELIEFS_NATS_PASS:?BELIEFS_NATS_PASS must be set}
      OVERRIDES_NATS_PASS: ${OVERRIDES_NATS_PASS:?OVERRIDES_NATS_PASS must be set}
    volumes:
      - ./deploy/nats-1m.conf:/etc/nats/nats.conf:ro
      - nats-data:/data

  neuromorphic:
    environment:
      # No per-service password → connects as dev_default (privileged subjects denied).
      NATS_URL: nats://nats:4222
      SQLITE_PATH: /data/sqlite/neuromorphic.db
      # Full PoC scale (~1M neurons). Needs a large-RAM host.
      NEURO_BRAINSTEM_N: "15000"
      NEURO_REFLEX_N: "10000"
      NEURO_SENSORY_N: "200000"
      NEURO_MOTOR_N: "100000"
      NEURO_CEREBELLUM_N: "100000"
      NEURO_ASSOCIATION_N: "200000"
      NEURO_PREDICTIVE_N: "100000"
      NEURO_WORKING_MEM_N: "25000"
      NEURO_FEATURE_N: "20000"
      NEURO_CONCEPT_N: "5000"
      NEURO_META_N: "3000"
      NEURO_COGNITIVE_ENABLED: "1"
      # Turbo: compute-bound loop, larger drain batches.
      NEURO_QUEUE_SIZE: "50"
      NEURO_LOOP_YIELD: "0"
    shm_size: "2gb"
    deploy:
      resources:
        limits:
          memory: 24g

  kernel:
    environment:
      NATS_URL: nats://kernel:${KERNEL_NATS_PASS}@nats:4222

  safety-supervisor:
    environment:
      NATS_URL: nats://safety-supervisor:${SAFETY_SUPERVISOR_NATS_PASS}@nats:4222

  beliefs:
    environment:
      NATS_URL: nats://beliefs:${BELIEFS_NATS_PASS}@nats:4222

  overrides:
    environment:
      NATS_URL: nats://overrides:${OVERRIDES_NATS_PASS}@nats:4222

  planner:
    environment:
      NATS_URL: nats://nats:4222

  external-api:
    environment:
      NATS_URL: nats://nats:4222

  dashboard:
    environment:
      NATS_URL: nats://nats:4222

  # Cloudflare Tunnel — exposes the dashboard without opening host ports.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: activelearning-cloudflared
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}"]
    restart: unless-stopped
    depends_on:
      - dashboard
