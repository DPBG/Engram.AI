# NATS server config for 1M neuron deployment
# The brain runs compute-bound loops (NEURO_LOOP_YIELD=0) and drains
# messages in batches between steps. Extend write_deadline to prevent
# slow consumer disconnects during long simulation steps.

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

write_deadline: "60s"

jetstream {
  store_dir: "/data"
}

# ---------------------------------------------------------------------------
# Per-service subject-permission allowlists (E1.1.4 — ADR 0001-nats-authz.md)
#
# Deny-by-default: every named user's publish/subscribe list is explicit.
# Anything not listed is rejected at the broker — transport-layer enforcement
# complementing the application-layer decision signing (Task 1.2).
#
# Privileged subjects — only kernel may publish:
#   decision.>  code.decision.>  policy.*  cognitive.response.validated
#
# Credential distribution:
#   Production  — set per-service *_NATS_PASS env vars (see .env.example);
#                 each service's NATS_URL embeds user:password.
#   Dev-mode    — set ENGRAM_NATS_DEV=1; broker uses the dev_default user
#                 (privileged subjects still denied) and services connect
#                 without credentials via the no_auth_user fallback.
#
# Generate passwords:
#   openssl rand -hex 32
# ---------------------------------------------------------------------------

authorization {
  # Anonymous / no-credentials clients connect as dev_default.
  # Privileged decision/policy subjects are denied even here so that
  # a misconfigured service cannot accidentally forge a decision.
  no_auth_user: dev_default

  users: [

    # ------------------------------------------------------------------
    # Dev catch-all — broad access, privileged subjects denied.
    # Active when ENGRAM_NATS_DEV=1 or no per-service password is set.
    # ------------------------------------------------------------------
    {
      user: dev_default
      permissions: {
        publish: {
          allow: [">"]
          deny: [
            "decision.>",
            "code.decision.>",
            "policy.restrict",
            "policy.rollback",
            "policy.update",
            "policy.load_profile",
            "policy.profile.status",
            "policy.rollback.status",
            "policy.update.status",
            "policy.restrict.status",
            "cognitive.response.validated",
            "cognitive.response.rejected",
          ]
        }
        subscribe: { allow: [">"] }
      }
    }

    # ------------------------------------------------------------------
    # Kernel — sole authorised publisher of decision/policy subjects.
    # ------------------------------------------------------------------
    {
      user: kernel
      password: $KERNEL_NATS_PASS
      permissions: {
        publish: {
          allow: [
            # Privileged governance subjects — kernel only (ADR 0001 §3)
            "decision.>",
            "code.decision.>",
            "policy.restrict",
            "policy.rollback.status",
            "policy.update.status",
            "policy.restrict.status",
            "policy.profile.status",
            "cognitive.response.validated",
            "cognitive.response.rejected",
            # Kernel-originated execution and control subjects
            "cognitive.execute",
            "speech.execute",
            "planner.mode",
            "kernel.status.response",
            "safety.halt.status",
            "safety.deny_escalation",
            # Request-reply inbox
            "_INBOX.>",
          ]
        }
        subscribe: {
          allow: [
            "proposal.new",
            "code.proposal",
            "policy.restrict.request",
            "policy.rollback",
            "policy.update",
            "policy.load_profile",
            "cognitive.response.validate",
            "kernel.status",
            "safety.halt",
            "safety.resume",
            "_INBOX.>",
          ]
        }
      }
    }

    # ------------------------------------------------------------------
    # Safety Supervisor — risk analysis only.
    # May NOT publish decision/policy subjects.
    # ------------------------------------------------------------------
    {
      user: safety-supervisor
      password: $SAFETY_SUPERVISOR_NATS_PASS
      permissions: {
        publish: {
          allow: [
            "safety.status.response",
            "system.health",
            "heartbeat.safety-supervisor",
            "_INBOX.>",
          ]
          # Belt-and-suspenders deny for extra clarity in audit logs.
          deny: [
            "decision.>",
            "code.decision.>",
            "policy.*",
            "cognitive.response.validated",
            "cognitive.response.rejected",
          ]
        }
        subscribe: {
          allow: [
            "safety.analyze.action",
            "safety.analyze.code",
            "safety.status",
            "system.shutdown",
            "_INBOX.>",
          ]
        }
      }
    }

    # ------------------------------------------------------------------
    # Beliefs — norm graph; may NOT publish decision/policy subjects.
    # ------------------------------------------------------------------
    {
      user: beliefs
      password: $BELIEFS_NATS_PASS
      permissions: {
        publish: {
          allow: [
            "beliefs.query.response",
            "system.health",
            "heartbeat.beliefs",
            "_INBOX.>",
          ]
          deny: [
            "decision.>",
            "code.decision.>",
            "policy.*",
            "cognitive.response.validated",
            "cognitive.response.rejected",
          ]
        }
        subscribe: {
          allow: [
            "beliefs.add_node",
            "beliefs.add_edge",
            "beliefs.update",
            "beliefs.query",
            "beliefs.contradictions",
            "beliefs.query.request",
            "system.shutdown",
            "_INBOX.>",
          ]
        }
      }
    }

    # ------------------------------------------------------------------
    # Overrides — human override flow; may NOT publish decision/policy subjects.
    # Publishes proposal.new (like any proposal source) and waits on decision.<trace>.
    # ------------------------------------------------------------------
    {
      user: overrides
      password: $OVERRIDES_NATS_PASS
      permissions: {
        publish: {
          allow: [
            "proposal.new",
            "override.result.>",
            "override.status.response",
            "system.health",
            "heartbeat.overrides",
            "_INBOX.>",
          ]
          deny: [
            "decision.>",
            "code.decision.>",
            "policy.*",
            "cognitive.response.validated",
            "cognitive.response.rejected",
          ]
        }
        subscribe: {
          allow: [
            "override.request",
            "override.status",
            "decision.>",
            "system.shutdown",
            "_INBOX.>",
          ]
        }
      }
    }

  ]
}
