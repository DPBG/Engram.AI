[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "activelearning-kernel"
version = "0.1.0"
description = "Moral Kernel service for ActiveLearningAI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "ActiveLearningAI Team"}
]
keywords = ["ai", "robotics", "safety", "moral-kernel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "nats-py>=2.6.0",
    "pydantic>=2.5.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "mutmut>=3.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=kernel --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# Mutation testing (issue #211 / M1.18): scoped to evaluator.py's
# risk-clamping logic, the class of bug PR #122 fixed one instance of
# (missing risk analysis silently treated as zero risk). See
# docs/MUTATION-TESTING.md for the workflow and the enforced kill-rate floor.
[tool.mutmut]
source_paths = ["src"]
only_mutate = ["src/kernel/evaluator.py"]
pytest_add_cli_args_test_selection = ["tests/test_evaluator.py"]
# The full evaluator suite runs in well under a second; a generous multiplier
# just avoids flaking on a loaded CI runner, not because mutants are slow.
timeout_multiplier = 15.0
