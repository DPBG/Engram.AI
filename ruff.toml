# Repo-wide Ruff configuration (matches the per-service [tool.ruff] settings).
# CI enforces two blocking gates: the "real bug" subset (E9,F63,F7,F82) and the
# full rule set (E,F,I,N,W,UP). See .github/workflows/test.yml.
line-length = 100
target-version = "py311"

extend-exclude = [
    ".venv",
    ".localrun",
    "data",
    "staging_videos",
    "brain-viz",
    "node_modules",
    "sdk/examples",
]

[lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
