<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Engram logo — a neural constellation">
  <title>Engram</title>
  <defs>
    <radialGradient id="eg-bg" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#16264a"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </radialGradient>
    <radialGradient id="eg-inner" cx="0.52" cy="0.46" r="0.58">
      <stop offset="0" stop-color="#1e5f8f" stop-opacity="0.45"/>
      <stop offset="0.7" stop-color="#0e1730" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0e1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eg-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#5ea4f5"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="eg-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#5ea4f5"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="eg-node" cx="0.5" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#daf6ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </radialGradient>
    <radialGradient id="eg-fire" cx="0.5" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#e9fff2"/>
      <stop offset="1" stop-color="#38d97a"/>
    </radialGradient>
    <filter id="eg-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- dark backdrop so the neon stays visible on light OR dark pages -->
  <circle cx="120" cy="120" r="115" fill="url(#eg-bg)"/>
  <circle cx="120" cy="120" r="86"  fill="url(#eg-inner)"/>
  <circle cx="120" cy="120" r="115" fill="none" stroke="url(#eg-ring)" stroke-width="2.5" opacity="0.7"/>

  <!-- synapses -->
  <g filter="url(#eg-glow)" stroke="url(#eg-edge)" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
    <line x1="120" y1="56"  x2="171" y2="76"/>
    <line x1="171" y1="76"  x2="187" y2="122"/>
    <line x1="187" y1="122" x2="162" y2="170"/>
    <line x1="162" y1="170" x2="110" y2="184"/>
    <line x1="110" y1="184" x2="64"  y2="160"/>
    <line x1="64"  y1="160" x2="55"  y2="102"/>
    <line x1="55"  y1="102" x2="120" y2="56"/>
    <line x1="120" y1="56"  x2="116" y2="108"/>
    <line x1="116" y1="108" x2="150" y2="124"/>
    <line x1="150" y1="124" x2="187" y2="122"/>
    <line x1="116" y1="108" x2="96"  y2="142"/>
    <line x1="96"  y1="142" x2="64"  y2="160"/>
    <line x1="150" y1="124" x2="137" y2="156"/>
    <line x1="137" y1="156" x2="110" y2="184"/>
    <line x1="96"  y1="142" x2="137" y2="156"/>
    <line x1="171" y1="76"  x2="150" y2="124"/>
    <line x1="55"  y1="102" x2="116" y2="108"/>
    <line x1="116" y1="108" x2="137" y2="156"/>
  </g>

  <!-- neurons -->
  <g filter="url(#eg-glow)">
    <circle cx="120" cy="56"  r="5"   fill="url(#eg-node)"/>
    <circle cx="187" cy="122" r="5"   fill="url(#eg-node)"/>
    <circle cx="162" cy="170" r="4.5" fill="url(#eg-node)"/>
    <circle cx="64"  cy="160" r="5"   fill="url(#eg-node)"/>
    <circle cx="55"  cy="102" r="4.5" fill="url(#eg-node)"/>
    <circle cx="96"  cy="142" r="4.5" fill="url(#eg-node)"/>
    <circle cx="137" cy="156" r="5"   fill="url(#eg-node)"/>
    <circle cx="116" cy="108" r="6"   fill="url(#eg-node)"/>
    <circle cx="171" cy="76"  r="6.5" fill="url(#eg-fire)"/>
    <circle cx="110" cy="184" r="6"   fill="url(#eg-fire)"/>
    <circle cx="150" cy="124" r="7"   fill="url(#eg-fire)"/>
  </g>
</svg>
