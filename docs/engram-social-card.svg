<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Engram — a self-aware, continuously-learning neuromorphic AI">
  <title>Engram — neuromorphic AI</title>
  <defs>
    <radialGradient id="sc-bg" cx="0.5" cy="0.32" r="0.95">
      <stop offset="0" stop-color="#172a52"/>
      <stop offset="0.55" stop-color="#0c1326"/>
      <stop offset="1" stop-color="#080b16"/>
    </radialGradient>
    <radialGradient id="sc-haze" cx="0.5" cy="0.24" r="0.5">
      <stop offset="0" stop-color="#1f6ea8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0c1326" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sc-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#5ea4f5"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="sc-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fe0f5"/>
      <stop offset="0.5" stop-color="#7db4ff"/>
      <stop offset="1" stop-color="#b79cff"/>
    </linearGradient>
    <radialGradient id="sc-node" cx="0.5" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#daf6ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </radialGradient>
    <radialGradient id="sc-fire" cx="0.5" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#e9fff2"/>
      <stop offset="1" stop-color="#38d97a"/>
    </radialGradient>
    <filter id="sc-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- reusable neural constellation (ring + synapses + neurons) in 0..240 space -->
    <g id="sc-mark">
      <circle cx="120" cy="120" r="106" fill="none" stroke="url(#sc-edge)" stroke-width="2.5" opacity="0.6"/>
      <g stroke="url(#sc-edge)" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
        <line x1="120" y1="56"  x2="171" y2="76"/>
        <line x1="171" y1="76"  x2="187" y2="122"/>
        <line x1="187" y1="122" x2="162" y2="170"/>
        <line x1="162" y1="170" x2="110" y2="184"/>
        <line x1="110" y1="184" x2="64"  y2="160"/>
        <line x1="64"  y1="160" x2="55"  y2="102"/>
        <line x1="55"  y1="102" x2="120" y2="56"/>
        <line x1="120" y1="56"  x2="116" y2="108"/>
        <line x1="116" y1="108" x2="150" y2="124"/>
        <line x1="150" y1="124" x2="187" y2="122"/>
        <line x1="116" y1="108" x2="96"  y2="142"/>
        <line x1="96"  y1="142" x2="64"  y2="160"/>
        <line x1="150" y1="124" x2="137" y2="156"/>
        <line x1="137" y1="156" x2="110" y2="184"/>
        <line x1="96"  y1="142" x2="137" y2="156"/>
        <line x1="171" y1="76"  x2="150" y2="124"/>
        <line x1="55"  y1="102" x2="116" y2="108"/>
        <line x1="116" y1="108" x2="137" y2="156"/>
      </g>
      <g>
        <circle cx="120" cy="56"  r="5"   fill="url(#sc-node)"/>
        <circle cx="187" cy="122" r="5"   fill="url(#sc-node)"/>
        <circle cx="162" cy="170" r="4.5" fill="url(#sc-node)"/>
        <circle cx="64"  cy="160" r="5"   fill="url(#sc-node)"/>
        <circle cx="55"  cy="102" r="4.5" fill="url(#sc-node)"/>
        <circle cx="96"  cy="142" r="4.5" fill="url(#sc-node)"/>
        <circle cx="137" cy="156" r="5"   fill="url(#sc-node)"/>
        <circle cx="116" cy="108" r="6"   fill="url(#sc-node)"/>
        <circle cx="171" cy="76"  r="6.5" fill="url(#sc-fire)"/>
        <circle cx="110" cy="184" r="6"   fill="url(#sc-fire)"/>
        <circle cx="150" cy="124" r="7"   fill="url(#sc-fire)"/>
      </g>
    </g>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#sc-bg)"/>
  <rect width="1280" height="640" fill="url(#sc-haze)"/>
  <!-- faint constellation watermark -->
  <use href="#sc-mark" transform="translate(316,4) scale(2.7)" opacity="0.06"/>
  <!-- inner border -->
  <rect x="14" y="14" width="1252" height="612" rx="20" fill="none" stroke="url(#sc-edge)" stroke-width="1.5" opacity="0.22"/>

  <!-- foreground logomark -->
  <circle cx="640" cy="150" r="118" fill="url(#sc-haze)" opacity="0.7"/>
  <g filter="url(#sc-glow)">
    <use href="#sc-mark" transform="translate(553.6,63.6) scale(0.72)"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="640" y="362" text-anchor="middle"
        font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="120" font-weight="800" letter-spacing="12" fill="url(#sc-word)">ENGRAM</text>

  <text x="640" y="414" text-anchor="middle"
        font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="500" letter-spacing="0.5" fill="#aeb9c9">A self-aware, continuously-learning neuromorphic AI</text>

  <line x1="380" y1="452" x2="900" y2="452" stroke="url(#sc-edge)" stroke-width="2" opacity="0.45"/>

  <text x="640" y="500" text-anchor="middle"
        font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="600" letter-spacing="3" fill="#8a97ab">~1M NEURONS&#160;&#160;·&#160;&#160;13 BRAIN REGIONS&#160;&#160;·&#160;&#160;6 LEARNING MECHANISMS&#160;&#160;·&#160;&#160;REAL-TIME STDP</text>

  <text x="640" y="592" text-anchor="middle"
        font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="500" letter-spacing="2" fill="#5a6678">github.com/DPBG/Engram.AI</text>
</svg>
