[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuromorphic"
version = "0.1.0"
description = "Neuromorphic Cognitive Core — spiking neural network with STDP learning"
requires-python = ">=3.11"
dependencies = [
    "nats-py>=2.6.0",
    "pydantic>=2.5.0",
    "aiosqlite>=0.19.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "mujoco>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    # Cross-package integration tests (test_safety_pipeline.py) import
    # beliefs.graph, which requires networkx. Without it, pytest aborts at
    # collection time in the neuromorphic-only CI environment.
    "networkx>=3.2.0",
]
# Optional compiled kernels (M4 performance prototype).
# Install with: uv run --extra compiled python -m pytest tests/test_compiled_stdp.py
compiled = [
    "numba>=0.59.0",
]
# Experimental GPU synapse-op backend (issue #135 research spike, see
# gpu_synapse_ops.py / docs/GPU-SYNAPSE-BACKEND-FEASIBILITY.md). Not a
# default dependency: jax/jaxlib add ~90MB and are lazy-imported, so the
# rest of neuromorphic works unmodified without this extra installed.
gpu = [
    "jax>=0.4.20",
]
# Dev-time-only ground-truth check for the pure-NumPy metrics benchmarks.py
# reimplements (silhouette score, nearest-centroid probe) — see issue #330 and
# scripts/verify_silhouette_score.py. sklearn is NOT a dependency of
# benchmarks.py itself and never ships with the benchmark code; this extra
# exists solely so the verification script has something to compare against.
verify = [
    "scikit-learn>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true

[dependency-groups]
dev = [
    "opencv-python-headless",
]
