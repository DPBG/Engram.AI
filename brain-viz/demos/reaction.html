<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engram — Brain Reaction Demo</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap">
    <style>

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #060a14;
            --panel: #0a0e1a;
            --border: rgba(94, 164, 245, 0.12);
            --border-active: rgba(94, 164, 245, 0.4);
            --accent: #5ea4f5;
            --accent-dim: rgba(94, 164, 245, 0.6);
            --text: #c8d0e0;
            --text-dim: #5a6478;
            --text-bright: #e8ecf4;
            --green: #38d97a;
            --amber: #f5a623;
            --red: #f44;
            --cyan: #22d3ee;
            --purple: #a78bfa;
            --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
            --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Scan line overlay ────────────────────────────────── */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.03) 2px,
                rgba(0, 0, 0, 0.03) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        /* ── Top bar ─────────────────────────────────────────── */
        .topbar {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-logo {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
        }
        .topbar-sep {
            width: 1px;
            height: 16px;
            background: var(--border);
        }
        .topbar-title {
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-dim);
        }
        .demo-badge {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 3px 10px;
            border-radius: 3px;
            background: rgba(245, 166, 35, 0.15);
            color: var(--amber);
            border: 1px solid rgba(245, 166, 35, 0.3);
            text-transform: uppercase;
        }

        /* ── Main layout ─────────────────────────────────────── */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ── Left panel ──────────────────────────────────────── */
        .panel-left {
            width: 340px;
            flex-shrink: 0;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .section {
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
        }
        .section-label {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-label::before {
            content: '';
            width: 3px;
            height: 10px;
            background: var(--accent);
            border-radius: 1px;
        }

        /* Drop zone */
        .drop-zone {
            border: 1px dashed var(--border);
            border-radius: 6px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            min-height: 100px;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent);
            background: rgba(94, 164, 245, 0.04);
        }
        .drop-zone.dragover {
            box-shadow: inset 0 0 30px rgba(94, 164, 245, 0.08);
        }
        .drop-icon {
            font-size: 28px;
            margin-bottom: 8px;
            opacity: 0.3;
            display: block;
        }
        .drop-text {
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.6;
        }
        .drop-text strong {
            color: var(--accent-dim);
        }
        .drop-zone input[type="file"] {
            display: none;
        }
        .drop-preview {
            display: none;
            align-items: center;
            gap: 12px;
        }
        .drop-preview.active {
            display: flex;
        }
        .drop-preview img {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        .drop-preview-info {
            text-align: left;
        }
        .drop-preview-name {
            font-size: 11px;
            color: var(--text);
            margin-bottom: 2px;
            word-break: break-all;
        }
        .drop-preview-size {
            font-size: 9px;
            color: var(--text-dim);
        }
        .drop-default { display: block; }
        .drop-zone.has-file .drop-default { display: none; }

        /* Text input */
        .text-input-row {
            display: flex;
            gap: 8px;
        }
        .text-input {
            flex: 1;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px 12px;
            color: var(--text);
            font-family: var(--mono);
            font-size: 11px;
            outline: none;
            transition: border-color 0.2s;
        }
        .text-input:focus {
            border-color: var(--accent);
        }
        .text-input::placeholder {
            color: var(--text-dim);
        }
        .btn-send {
            padding: 8px 14px;
            background: rgba(94, 164, 245, 0.12);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--accent);
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }
        .btn-send:hover {
            background: rgba(94, 164, 245, 0.2);
            border-color: var(--accent);
        }

        /* Preset buttons */
        .presets {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .preset-btn {
            padding: 10px 8px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-dim);
            font-family: var(--mono);
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            line-height: 1.4;
        }
        .preset-btn:hover {
            background: rgba(94, 164, 245, 0.06);
            border-color: var(--border-active);
            color: var(--text);
        }
        .preset-btn:active {
            transform: scale(0.97);
        }
        .preset-tag {
            display: block;
            font-size: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 3px;
        }
        .preset-tag.visual { color: var(--cyan); }
        .preset-tag.auditory { color: var(--green); }
        .preset-tag.text { color: var(--purple); }
        .preset-tag.multi { color: var(--amber); }

        /* ── Activity Log ────────────────────────────────────── */
        .log-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        .log-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 0 18px 12px;
            scrollbar-width: thin;
            scrollbar-color: rgba(94,164,245,0.2) transparent;
        }
        .log-scroll::-webkit-scrollbar { width: 4px; }
        .log-scroll::-webkit-scrollbar-track { background: transparent; }
        .log-scroll::-webkit-scrollbar-thumb { background: rgba(94,164,245,0.2); border-radius: 2px; }

        .log-entry {
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            animation: logSlideIn 0.3s ease-out;
        }
        @keyframes logSlideIn {
            from { opacity: 0; transform: translateX(-8px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .log-time {
            font-size: 9px;
            color: var(--text-dim);
            margin-bottom: 2px;
        }
        .log-region {
            font-size: 10px;
            font-weight: 600;
            margin-bottom: 1px;
        }
        .log-detail {
            font-size: 9px;
            color: var(--text-dim);
            line-height: 1.4;
        }
        .log-bar {
            margin-top: 4px;
            height: 3px;
            border-radius: 1.5px;
            background: rgba(255,255,255,0.04);
            overflow: hidden;
        }
        .log-bar-fill {
            height: 100%;
            border-radius: 1.5px;
            transition: width 0.5s ease-out;
        }

        /* ── Processing overlay ──────────────────────────────── */
        .processing {
            display: none;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
        }
        .processing.active {
            display: block;
        }
        .processing-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .processing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: procPulse 1s infinite;
        }
        @keyframes procPulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--accent); }
            50% { opacity: 0.4; box-shadow: none; }
        }
        .processing-text {
            font-size: 10px;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 0.5px;
        }
        .processing-bar {
            height: 2px;
            background: rgba(255,255,255,0.04);
            border-radius: 1px;
            overflow: hidden;
        }
        .processing-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--cyan));
            border-radius: 1px;
            transition: width 0.15s linear;
        }

        /* ── Summary card ────────────────────────────────────── */
        .summary {
            display: none;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            background: rgba(56, 217, 122, 0.03);
        }
        .summary.active {
            display: block;
            animation: summaryIn 0.4s ease-out;
        }
        @keyframes summaryIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .summary-label {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--green);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .summary-label::before {
            content: '';
            width: 3px;
            height: 10px;
            background: var(--green);
            border-radius: 1px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .summary-stat {
            padding: 6px 8px;
            background: rgba(255,255,255,0.02);
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .summary-stat-label {
            font-size: 8px;
            color: var(--text-dim);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .summary-stat-val {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-bright);
            margin-top: 2px;
        }
        .summary-stat-val.green { color: var(--green); }
        .summary-stat-val.amber { color: var(--amber); }
        .summary-stat-val.cyan { color: var(--cyan); }

        /* ── Brain viewport ──────────────────────────────────── */
        .viewport {
            flex: 1;
            position: relative;
            background: var(--bg);
        }
        .viewport iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        /* Corner decorations */
        .viewport::before, .viewport::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 1px solid var(--border);
            pointer-events: none;
            z-index: 2;
        }
        .viewport::before {
            top: 12px; left: 12px;
            border-right: none; border-bottom: none;
        }
        .viewport::after {
            bottom: 12px; right: 12px;
            border-left: none; border-top: none;
        }

        /* ── Bottom bar ──────────────────────────────────────── */
        .bottombar {
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: var(--panel);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .bottombar-item {
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-dim);
        }
        .bottombar-item strong {
            color: var(--text);
            font-weight: 500;
        }
        .bottombar-sep {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--text-dim);
            opacity: 0.4;
        }

        /* ── Idle state hint in viewport ─────────────────────── */
        .viewport-hint {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .viewport-hint.visible {
            opacity: 1;
        }
        .viewport-hint-text {
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 60px;
        }

        /* ── Mobile responsive ──────────────────────────────── */
        @media (max-width: 768px) {
            body {
                overflow-y: auto;
                height: auto;
                min-height: 100vh;
            }

            .topbar {
                padding: 0 12px;
            }

            .topbar-title {
                font-size: 10px;
                letter-spacing: 1px;
            }

            .main {
                flex-direction: column;
                overflow: visible;
                flex: none;
            }

            .panel-left {
                width: 100%;
                flex-shrink: 0;
                max-height: none;
                overflow-y: visible;
                overflow: visible;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .viewport {
                width: 100%;
                height: 300px;
                flex-shrink: 0;
                flex: none;
            }

            .viewport iframe {
                height: 300px;
            }

            .drop-zone {
                padding: 16px 12px;
                min-height: 80px;
            }

            .section {
                padding: 12px 14px;
            }

            .presets {
                grid-template-columns: 1fr 1fr;
            }

            .preset-btn {
                min-height: 44px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                touch-action: manipulation;
            }

            .btn-send {
                min-height: 44px;
                touch-action: manipulation;
            }

            .text-input {
                min-height: 44px;
            }

            .log-section {
                max-height: 200px;
                flex: none;
                overflow: hidden;
            }

            .log-scroll {
                padding: 0 14px 10px;
            }

            .summary-grid {
                grid-template-columns: 1fr 1fr;
            }

            .bottombar {
                flex-wrap: wrap;
                height: auto;
                padding: 8px 12px;
                gap: 10px;
            }

            .bottombar-item {
                font-size: 8px;
            }

            /* Hide corner decorations on mobile - they overlap content */
            .viewport::before,
            .viewport::after {
                display: none;
            }
        }
    </style>
</head>
<body>

<!-- ── Top Bar ────────────────────────────────────────────── -->
<div class="topbar">
    <div class="topbar-left">
        <span class="topbar-logo">Engram</span>
        <span class="topbar-sep"></span>
        <span class="topbar-title">Neural Reaction Probe</span>
    </div>
    <span class="demo-badge" id="mode-badge">Interactive Demo</span>
</div>

<!-- ── Main Layout ────────────────────────────────────────── -->
<div class="main">

    <!-- Left Panel -->
    <div class="panel-left">

        <!-- Input: Drop Zone -->
        <div class="section">
            <div class="section-label">Sensory Input</div>
            <div class="drop-zone" id="drop-zone">
                <div class="drop-default">
                    <span class="drop-icon">&darr;</span>
                    <div class="drop-text">
                        Drop an <strong>image</strong> here<br>
                        or click to select
                    </div>
                </div>
                <div class="drop-preview" id="drop-preview">
                    <img id="preview-img" src="" alt="">
                    <div class="drop-preview-info">
                        <div class="drop-preview-name" id="preview-name"></div>
                        <div class="drop-preview-size" id="preview-size"></div>
                    </div>
                </div>
                <input type="file" id="file-input" accept="image/*">
            </div>
        </div>

        <!-- Input: Text -->
        <div class="section">
            <div class="section-label">Text Stimulus</div>
            <div class="text-input-row">
                <input type="text" class="text-input" id="text-input" placeholder="Type a word or phrase...">
                <button class="btn-send" id="btn-text-send">SEND</button>
            </div>
        </div>

        <!-- Presets -->
        <div class="section">
            <div class="section-label">Quick Stimuli</div>
            <div class="presets">
                <button class="preset-btn" data-preset="dog">
                    <span class="preset-tag visual">Visual</span>
                    Show it a dog
                </button>
                <button class="preset-btn" data-preset="sound">
                    <span class="preset-tag auditory">Auditory</span>
                    Play a loud sound
                </button>
                <button class="preset-btn" data-preset="flash">
                    <span class="preset-tag visual">Visual</span>
                    Flash a bright light
                </button>
                <button class="preset-btn" data-preset="hello">
                    <span class="preset-tag text">Language</span>
                    Say "Hello"
                </button>
                <button class="preset-btn" data-preset="pain">
                    <span class="preset-tag multi">Reflex</span>
                    Touch something hot
                </button>
                <button class="preset-btn" data-preset="novel">
                    <span class="preset-tag multi">Novel</span>
                    Show something new
                </button>
            </div>
        </div>

        <!-- Processing indicator -->
        <div class="processing" id="processing">
            <div class="processing-header">
                <div class="processing-dot"></div>
                <span class="processing-text" id="processing-text">Encoding sensory input...</span>
            </div>
            <div class="processing-bar">
                <div class="processing-bar-fill" id="processing-bar"></div>
            </div>
        </div>

        <!-- Summary card -->
        <div class="summary" id="summary">
            <div class="summary-label">Brain Response</div>
            <div class="summary-grid" id="summary-grid"></div>
        </div>

        <!-- Activity log -->
        <div class="section log-section">
            <div class="section-label">Cascade Log</div>
            <div class="log-scroll" id="log-scroll"></div>
        </div>

    </div>

    <!-- Brain Viewport -->
    <div class="viewport">
        <iframe id="brain-frame"></iframe>
        <script>
        // Build iframe src, passing through live/ws params from parent URL
        (function() {
            var params = new URLSearchParams(window.location.search);
            var src = '../index.html?embed=true&labels=false';
            if (params.get('mode')) src += '&mode=' + params.get('mode');
            if (params.get('ws')) src += '&ws=' + encodeURIComponent(params.get('ws'));
            document.getElementById('brain-frame').src = src;
        })();
        </script>
    </div>

</div>

<!-- ── Bottom Bar ─────────────────────────────────────────── -->
<div class="bottombar">
    <span class="bottombar-item"><strong>Engram</strong> Neural Architecture</span>
    <span class="bottombar-sep"></span>
    <span class="bottombar-item">MIT License</span>
    <span class="bottombar-sep"></span>
    <span class="bottombar-item"><strong>1,056,800</strong> neurons</span>
    <span class="bottombar-sep"></span>
    <span class="bottombar-item"><strong>1.31B</strong> synapses</span>
    <span class="bottombar-sep"></span>
    <span class="bottombar-item"><strong>48</strong> synapse groups</span>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// Engram Brain Reaction Demo — Live + Simulated modes
// ═══════════════════════════════════════════════════════════════════

const REGION_META = {
    sensory_cortex:     { label: 'Sensory Cortex',   color: '#22d3ee', neurons: 200000 },
    brainstem:          { label: 'Brainstem',         color: '#ff4d4d', neurons: 1800 },
    reflex_arc:         { label: 'Reflex Arc',        color: '#ff9933', neurons: 1000 },
    feature_layer:      { label: 'Feature Layer',     color: '#22c7c0', neurons: 20000 },
    association_cortex: { label: 'Association',        color: '#5ea4f5', neurons: 500000 },
    predictive_layer:   { label: 'Predictive',        color: '#a673f5', neurons: 100000 },
    cerebellum:         { label: 'Cerebellum',        color: '#f2d933', neurons: 50000 },
    working_memory:     { label: 'Working Memory',    color: '#f573b5', neurons: 20000 },
    concept_layer:      { label: 'Concept Layer',     color: '#f5ba26', neurons: 5000 },
    meta_controller:    { label: 'Meta Control',      color: '#e6e6f0', neurons: 3000 },
    motor_cortex:       { label: 'Motor Cortex',      color: '#38d97a', neurons: 100000 },
};

// ── Simulated cascade profiles (used when NOT in live mode) ──────
// Rate values: 0.01 = barely visible, 0.04 = dim, 0.08 = medium, 0.15 = bright, 0.20 = peak
// With sqrt(rate*5) mapping: 0.01→0.22, 0.04→0.45, 0.08→0.63, 0.15→0.87, 0.20→1.0
const CASCADE_PROFILES = {
    dog: {
        name: 'Visual Object Recognition',
        inputType: 'visual',
        stages: [
            { region: 'sensory_cortex',     delay: 0,    rate: 0.18, detail: 'Visual encoding: 64x64 grayscale -> rate-coded spikes (4,096 neurons active)' },
            { region: 'brainstem',           delay: 50,   rate: 0.04, detail: 'Arousal response: NE + ACh spike — novel visual stimulus detected' },
            { region: 'feature_layer',       delay: 150,  rate: 0.14, detail: 'Feature extraction: edges, textures, shapes via STDP-learned filters' },

// Live state

let wsReconnectTimer = null;

if (isLiveMode) {
    modeBadge.textContent = 'CONNECTING...';

    modeBadge.style.color = '#ffcc00';

function connectLiveWs() {
    // Clear any pending reconnect
    if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }

    // Close existing socket cleanly
    if (liveWs) {
        try { liveWs.onclose = null; liveWs.onerror = null; liveWs.close(); } catch (e) { /* ok */ }
        liveWs = null;
    }

    try {
        liveWs = new WebSocket(wsUrl);
    } catch (e) {
        setModeBadge('OFFLINE', '#ff4d4d');
        wsReconnectTimer = setTimeout(connectLiveWs, 5000);
        return;
    }

    liveWs.onopen = () => {
        liveConnected = true;
        setModeBadge('LIVE', '#38d97a');
    };

    liveWs.onmessage = (event) => {
        try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'neuro_update' && msg.data) {
                lastNeuroData = msg.data;
            } else if (msg.type === 'init' && msg.data && msg.data.neuromorphic) {
                lastNeuroData = msg.data.neuromorphic;
            }
        } catch (e) { /* ignore */ }
    };

    liveWs.onclose = () => {
        liveConnected = false;
        setModeBadge('DISCONNECTED', '#ff4d4d');
        // Retry after 5s (only if no retry already pending)
        if (!wsReconnectTimer) {
            wsReconnectTimer = setTimeout(connectLiveWs, 5000);
        }
    };

    liveWs.onerror = () => {
        // onerror always fires before onclose — just update badge, let onclose handle retry
        liveConnected = false;
        setModeBadge('OFFLINE', '#ff4d4d');
    };
}

function setModeBadge(text, color) {
    modeBadge.textContent = text;
    modeBadge.style.background = `rgba(${hexToRgb(color)}, 0.15)`;
    modeBadge.style.color = color;
}

function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `${r}, ${g}, ${b}`;
}

// ── Inject stimulus into brain via REST API ──────────────────
async function injectObservation(provenance, data) {
    try {
        const resp = await fetch(dashboardBase + '/api/observation', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ provenance, data }),
        });
        return await resp.json();
    } catch (e) {
        console.warn('Inject failed:', e);
        return { ok: false, error: e.message };
    }
}

// Send image as 64x64 grayscale pixel array — same format the brain expects
async function injectImageToBrain(imgElement) {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(imgElement, 0, 0, 64, 64);
    const imageData = ctx.getImageData(0, 0, 64, 64);
    const pixels = [];
    for (let i = 0; i < imageData.data.length; i += 4) {
        const gray = (imageData.data[i] * 0.299 + imageData.data[i+1] * 0.587 + imageData.data[i+2] * 0.114) / 255;
        pixels.push(parseFloat(gray.toFixed(4)));
    }
    return injectObservation('sensor.image', pixels);
}

// ── Fetch brain state via REST API ──
async function fetchBrainState() {
    try {
        const resp = await fetch(dashboardBase + '/api/neuromorphic');
        const json = await resp.json();
        return json.neuromorphic || null;
    } catch (e) {
        return null;
    }
}

// ── Live mode cascade — hybrid: real brain state + architectural pathway ──
async function runLiveCascade(stimulusType, textContent) {
    if (cascadeRunning) return;
    cascadeRunning = true;

    // Clear previous (including any stale simulated timeouts)
    cascadeTimeouts.forEach(t => clearTimeout(t));
    cascadeTimeouts = [];
    logScroll.innerHTML = '';
    summaryEl.classList.remove('active');

    // Show processing
    processingEl.classList.add('active');
    processingText.textContent = 'Reading live brain state...';
    processingBar.style.width = '0%';

    try {

    // ── Step 1: Fetch real brain state ──
    const brainState = await fetchBrainState();
    const realStep = brainState ? (brainState.step_count || 0) : 0;
    const realRates = brainState ? (brainState.firing_rates || {}) : {};
    const realNeuromod = brainState ? (brainState.neuromodulation || {}) : {};
    const realDrives = brainState ? (brainState.drives || {}) : {};

    observeStartTime = Date.now();

    // Show live brain state
    addLiveLogEntry(0, 'LIVE BRAIN', 'Step ' + realStep.toLocaleString() + ' — 1,056,800 neurons active', '#38d97a');

    const activeRegions = Object.entries(realRates)
        .filter(([_, r]) => r > 0.001)
        .sort((a, b) => b[1] - a[1]);
    for (const [region, rate] of activeRegions) {
        const meta = REGION_META[region];
        if (meta) addLiveLogEntry(0, meta.label, (rate * 100).toFixed(2) + '% firing rate', meta.color);
    }

    // ── Step 2: Inject stimulus into real brain ──
    processingText.textContent = 'Injecting stimulus into brain...';
    processingBar.style.width = '15%';

    let injectResult;
    if (stimulusType === 'image') {
        addLiveLogEntry(Date.now() - observeStartTime, 'INJECTING', '64x64 grayscale → sensor.image → NATS', '#22d3ee');
        injectResult = await injectImageToBrain(previewImg);
    } else {
        const text = textContent || PRESET_TEXT[stimulusType] || stimulusType;
        addLiveLogEntry(Date.now() - observeStartTime, 'INJECTING', '"' + text + '" → observation.text → NATS', '#22d3ee');
        injectResult = await injectObservation('observation.text', text);
    }

    if (injectResult.ok) {
        addLiveLogEntry(Date.now() - observeStartTime, 'DELIVERED', 'Stimulus injected into live brain', '#38d97a');
    } else {
        addLiveLogEntry(Date.now() - observeStartTime, 'WARN', 'Injection issue: ' + (injectResult.error || '?'), '#ffcc00');
    }

    // ── Step 3: Show architectural processing pathway with real firing rates ──
    // The brain is training on 403 videos — a single stimulus gets processed in one step
    // but the aggregate metrics (published every 10s) won't show a visible spike.
    // Instead, we show the actual processing pathway with real neuron counts.
    processingText.textContent = 'Tracing neural pathway...';

    const profile = CASCADE_PROFILES[stimulusType] || CASCADE_PROFILES['text'];

    addLiveLogEntry(Date.now() - observeStartTime, 'PATHWAY', profile.name + ' — tracing through brain regions', '#a673f5');

    // Clear previous brain visualization so cascade lights up sequentially
    postToBrain({ type: 'demo_clear' });
    await new Promise(r => setTimeout(r, 100));

    // Run the cascade using real firing rates blended with pathway activation
    const cumulativeRates = {};

    for (let idx = 0; idx < profile.stages.length; idx++) {
        const stage = profile.stages[idx];

        // Stagger delays for visible sequential activation
        const stageDelay = idx === 0 ? 100 : Math.max(120, Math.min(stage.delay - (profile.stages[idx-1]?.delay || 0), 300));
        await new Promise(r => setTimeout(r, stageDelay));

        // Use the profile rate directly (already calibrated for the sqrt intensity curve)
        const realRate = realRates[stage.region] || 0;
        cumulativeRates[stage.region] = stage.rate;

        // Send to brain iframe for visualization
        postToBrain({
            type: 'demo_reaction',
            firingRates: { ...cumulativeRates },
            neuromodulation: profile.neuromod,
        });

        // Update progress
        const progress = 15 + ((idx + 1) / profile.stages.length) * 80;
        processingBar.style.width = progress + '%';

        // Log with real + pathway data
        const meta = REGION_META[stage.region];
        if (meta) {
            const realPct = (realRate * 100).toFixed(2);
            const activeNeurons = Math.floor(meta.neurons * stage.rate * 2);
            addLiveLogEntry(
                stage.delay,
                meta.label,
                stage.detail + ' [live: ' + realPct + '%, ~' + activeNeurons.toLocaleString() + ' neurons]',
                meta.color
            );
        }
    }

    // ── Step 4: Show summary with real brain data ──
    processingBar.style.width = '100%';
    await new Promise(r => setTimeout(r, 300));
    processingEl.classList.remove('active');

    const peakStage = profile.stages.reduce((a, b) => a.rate > b.rate ? a : b);
    const peakMeta = REGION_META[peakStage.region];
    const totalNeurons = profile.stages.reduce((sum, s) => {
        const m = REGION_META[s.region];
        return sum + (m ? Math.floor(m.neurons * s.rate * 2) : 0);
    }, 0);
    const hasMotor = profile.stages.some(s => s.region === 'motor_cortex');
    const cascadeTime = profile.stages[profile.stages.length - 1].delay;
    const da = realNeuromod.da || realNeuromod.dopamine || profile.neuromod.da;
    const predError = realDrives.prediction_error;

    summaryGrid.innerHTML = `
        <div class="summary-stat">
            <div class="summary-stat-label">Regions in Pathway</div>
            <div class="summary-stat-val cyan">${profile.stages.length} / 13</div>
        </div>
        <div class="summary-stat">
            <div class="summary-stat-label">Peak Region</div>
            <div class="summary-stat-val" style="color: ${peakMeta.color}; font-size: 11px">${peakMeta.label}</div>
        </div>
        <div class="summary-stat">
            <div class="summary-stat-label">Neurons Active</div>
            <div class="summary-stat-val green">${totalNeurons.toLocaleString()}</div>
        </div>
        <div class="summary-stat">
            <div class="summary-stat-label">Cascade Latency</div>
            <div class="summary-stat-val amber">${cascadeTime}ms</div>
        </div>
        <div class="summary-stat">
            <div class="summary-stat-label">Motor Response</div>
            <div class="summary-stat-val ${hasMotor ? 'green' : ''}">${hasMotor ? 'Yes' : 'None'}</div>
        </div>
        <div class="summary-stat">
            <div class="summary-stat-label">DA Level</div>
            <div class="summary-stat-val amber">${typeof da === 'number' ? da.toFixed(2) : 'N/A'}${predError != null ? ' | PE: ' + predError.toFixed(2) : ''}</div>
        </div>
    `;
    summaryEl.classList.add('active');

    // Fade out brain override after 3 seconds
    cascadeTimeouts.push(setTimeout(() => {
        postToBrain({ type: 'demo_clear' });
    }, 3000));

    } catch (e) {
        console.error('Live cascade error:', e);
        processingEl.classList.remove('active');
        addLiveLogEntry(Date.now() - observeStartTime, 'ERROR', e.message || 'Cascade failed', '#ff4d4d');
    } finally {
        cascadeRunning = false;
    }
}

    logScroll.appendChild(entry);
    logScroll.scrollTop = logScroll.scrollHeight;

function runSimulatedCascade(profileKey) {
    if (cascadeRunning) return;
    cascadeRunning = true;

    const profile = CASCADE_PROFILES[profileKey];
    if (!profile) { cascadeRunning = false; return; }

    cascadeTimeouts.forEach(t => clearTimeout(t));
    cascadeTimeouts = [];
    logScroll.innerHTML = '';
    summaryEl.classList.remove('active');

    processingEl.classList.add('active');
    processingText.textContent = 'Encoding sensory input...';
    processingBar.style.width = '0%';

    postToBrain({ type: 'demo_clear' });

    const encodingDelay = 600;
    let barStart = Date.now();
    const barInterval = setInterval(() => {
        const elapsed = Date.now() - barStart;
        processingBar.style.width = Math.min(100, (elapsed / encodingDelay) * 30) + '%';
        if (elapsed >= encodingDelay) clearInterval(barInterval);
    }, 30);

    cascadeTimeouts.push(setTimeout(() => {
        clearInterval(barInterval);
        processingText.textContent = 'Processing: ' + profile.name;

        const cumulativeRates = {};
        const activatedRegions = [];

        profile.stages.forEach((stage, idx) => {
            cascadeTimeouts.push(setTimeout(() => {
                cumulativeRates[stage.region] = stage.rate;
                postToBrain({
                    type: 'demo_reaction',
                    firingRates: { ...cumulativeRates },
                    neuromodulation: profile.neuromod,
                });
                const progress = 30 + ((idx + 1) / profile.stages.length) * 70;
                processingBar.style.width = progress + '%';
                addSimLogEntry(stage);
                activatedRegions.push(stage);

                if (idx === profile.stages.length - 1) {
                    cascadeTimeouts.push(setTimeout(() => {
                        processingEl.classList.remove('active');
                        showSimSummary(profile, activatedRegions);
                        cascadeRunning = false;
                        cascadeTimeouts.push(setTimeout(() => {
                            postToBrain({ type: 'demo_clear' });
                        }, 3000));
                    }, 500));
                }
            }, stage.delay));
        });
    }, encodingDelay));
}

function cancelCascade() {
    cascadeTimeouts.forEach(t => clearTimeout(t));
    cascadeTimeouts = [];
    cascadeRunning = false;
    processingEl.classList.remove('active');
}

// ── Unified dispatch ─────────────────────────────────────────
function runCascade(profileKey) {
    // If a cascade is already running, cancel it so the new one can start
    if (cascadeRunning) cancelCascade();

    if (isLiveMode && liveConnected) {
        // For text input, pass the user's typed text; presets use PRESET_TEXT mapping
        const textContent = profileKey === 'text' ? textInput.value.trim() : null;
        runLiveCascade(profileKey, textContent);
    } else {
        runSimulatedCascade(profileKey);
    }
}

function handleImageFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
        // Clear any stale onload handler before setting src
        previewImg.onload = null;

        previewName.textContent = file.name;
        previewSize.textContent = formatBytes(file.size);
        dropPreview.classList.add('active');
        dropZone.classList.add('has-file');

        if (isLiveMode && liveConnected) {
            // Wait for image to load in the img element, then inject
            previewImg.onload = function onceLoaded() {
                previewImg.onload = null; // clear after firing
                runCascade('image');
            };
        }

        previewImg.src = reader.result;

        if (!(isLiveMode && liveConnected)) {
            // In simulated mode, image data isn't needed — trigger immediately
            runCascade('image');
        }
    };
    reader.readAsDataURL(file);
}

// ── File drop handling ──────────────────────────────────────
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) handleImageFile(file);
});
fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) handleImageFile(fileInput.files[0]);
});

function formatBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
}

// ── Text input ──────────────────────────────────────────────
function sendTextInput() {
    const val = textInput.value.trim();
    if (val) runCascade('text');
}
btnTextSend.addEventListener('click', sendTextInput);
textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendTextInput();
});

// ── Presets ──────────────────────────────────────────────────
document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const preset = btn.dataset.preset;
        if (preset) runCascade(preset);
    });
});

// ── Shared helpers ───────────────────────────────────────────
function postToBrain(msg) {
    if (brainFrame.contentWindow) {
        brainFrame.contentWindow.postMessage(msg, '*');
    }
}

function addSimLogEntry(stage) {
    const meta = REGION_META[stage.region];
    if (!meta) return;
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    const pct = (stage.rate * 100).toFixed(1);
    entry.innerHTML = `
        <div class="log-time">+${stage.delay}ms</div>
        <div class="log-region" style="color: ${meta.color}">${meta.label}</div>
        <div class="log-detail">${stage.detail}</div>
        <div class="log-bar">
            <div class="log-bar-fill" style="width: ${pct * 10}%; background: ${meta.color}"></div>
        </div>
    `;
    logScroll.appendChild(entry);
    logScroll.scrollTop = logScroll.scrollHeight;
}

function showSimSummary(profile, activated) {
    const peakStage = activated.reduce((a, b) => a.rate > b.rate ? a : b);
    const peakMeta = REGION_META[peakStage.region];
    const totalNeurons = activated.reduce((sum, s) => {
        const m = REGION_META[s.region];
        return sum + (m ? Math.floor(m.neurons * s.rate * 2) : 0);
    }, 0);
    const hasMotor = activated.some(s => s.region === 'motor_cortex');
    const cascadeTime = activated[activated.length - 1].delay;

    summaryGrid.innerHTML = `
        <div class="summary-stat">
            <div class="summary-stat-label">Regions Activated</div>
            <div class="summary-stat-val cyan">${activated.length} / 13</div>
        </div>
        <div class="summary-stat">
            <div class="summary-stat-label">Peak Region</div>
            <div class="summary-stat-val" style="color: ${peakMeta.color}; font-size: 11px">${peakMeta.label}</div>
        </div>
        <div class="summary-stat">
            <div class="summary-stat-label">Neurons Activated</div>
            <div class="summary-stat-val green">${(totalNeurons).toLocaleString()}</div>
        </div>
        <div class="summary-stat">
            <div class="summary-stat-label">Cascade Duration</div>
            <div class="summary-stat-val amber">${cascadeTime}ms</div>
        </div>
        <div class="summary-stat">
            <div class="summary-stat-label">Motor Response</div>
            <div class="summary-stat-val ${hasMotor ? 'green' : ''}">${hasMotor ? 'Yes' : 'None'}</div>
        </div>
        <div class="summary-stat">
            <div class="summary-stat-label">DA Level</div>
            <div class="summary-stat-val amber">${profile.neuromod.da.toFixed(1)}x</div>
        </div>
    `;
    summaryEl.classList.add('active');
}
</script>
