<style>
:root{
  --eg-bg:#070b15;
  --eg-text:#cdd6e6; --eg-dim:#7a8699; --eg-faint:#525d70; --eg-bright:#eef2fb;
  --eg-border:rgba(120,160,225,0.12); --eg-border-2:rgba(120,160,225,0.22);
  --eg-panel-1:rgba(148,178,225,0.05); --eg-panel-2:rgba(148,178,225,0.012);
  --eg-sans:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --eg-mono:'JetBrains Mono','SF Mono', ui-monospace, monospace;
  --eg-accent:#a78bfa;
}
body{
  font-family:var(--eg-sans); color:var(--eg-text);
  background:
    radial-gradient(1000px 560px at 18% -6%, rgba(36,92,170,0.16), transparent 60%),
    radial-gradient(760px 460px at 100% 8%, rgba(124,92,222,0.10), transparent 60%),
    var(--eg-bg) !important;
  background-attachment:fixed;
}
.eg-topbar{position:fixed;inset:0 0 auto 0;height:54px;z-index:9000;display:flex;align-items:center;gap:14px;padding:0 18px;background:rgba(8,12,22,0.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--eg-border);font-family:var(--eg-mono)}
.eg-topbar a{text-decoration:none}
.eg-back{display:inline-flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.05em;color:var(--eg-dim);transition:color .2s}

.eg-sep{color:var(--eg-faint)}
.eg-page{color:var(--eg-accent)}
.eg-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:11px;letter-spacing:.05em}
.eg-right a{color:var(--eg-dim);transition:color .2s}
.eg-right a:hover{color:#7db4ff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(120,160,225,0.18);border-radius:6px}

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    color: #c8d6e5;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    overflow: hidden;
    height: 100vh;
}

/* ── HUD panel ──────────────────────────────────────── */
.hud {
    position: fixed; top: 66px; left: 16px;
    width: 220px;
    background: var(--eg-panel-1);
    backdrop-filter: blur(8px);
    border: 1px solid var(--eg-border);
    border-radius: 12px;
    padding: 14px;
    z-index: 90;
    font-size: 12px;
    line-height: 1.8;
    font-family: var(--eg-mono);
}
.hud .label { color: var(--eg-dim); text-transform: uppercase; letter-spacing: 0.05em; }
.hud .value { color: var(--eg-accent); font-weight: 600; }
.hud .channel-locomotion { color: #22aaff; }
.hud .channel-manipulation { color: #38d97a; }
.hud .channel-head { color: #f5c842; }
.hud .divider {
    border: none; border-top: 1px solid rgba(255,255,255,0.06);
    margin: 6px 0;
}

.status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
}
.status-dot.live { background: #38d97a; box-shadow: 0 0 6px #38d97a; }
.status-dot.simulated { background: #f5c842; }
.status-dot.idle { background: #6b7c93; }

/* ── Legend ──────────────────────────────────────────── */
.legend {
    position: fixed; bottom: 16px; left: 16px;
    background: var(--eg-panel-1);
    backdrop-filter: blur(8px);
    border: 1px solid var(--eg-border);
    border-radius: 12px;
    padding: 10px 14px;
    z-index: 90;
    font-size: 11px;
    font-family: var(--eg-mono);
    color: var(--eg-dim);
    text-transform: uppercase; letter-spacing: 0.05em;
    display: flex; gap: 14px;
}
.legend-item {
    display: flex; align-items: center; gap: 5px;
}
.legend-swatch {
    width: 10px; height: 10px; border-radius: 2px;
}

/* ── Pulse buttons ──────────────────────────────────── */
.pulse-btn {
    background: var(--eg-panel-1);
    border: 1px solid var(--c, var(--eg-border));
    border-radius: 8px;
    color: var(--c, var(--eg-text));
    font-family: var(--eg-mono);
    font-size: 10px;
    padding: 3px 8px;
    cursor: pointer;
    transition: all 0.2s;
}
.pulse-btn:hover { background: rgba(255,255,255,0.12); border-color: var(--eg-accent); }
.pulse-btn:active { transform: scale(0.95); }

/* ── Self-view panel ───────────────────────────────── */
.self-view {
    position: fixed; bottom: 16px; right: 16px;
    background: var(--eg-panel-1);
    backdrop-filter: blur(8px);
    border: 1px solid var(--eg-border);
    border-radius: 12px;
    padding: 10px;
    z-index: 90;
    text-align: center;
}
.self-view-title {
    font-size: 10px;
    font-weight: 600;
    color: var(--eg-accent);
    font-family: var(--eg-mono);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
}
.self-view canvas {
    width: 128px; height: 128px;
    border: 1px solid var(--eg-border);
    border-radius: 8px;
    image-rendering: pixelated;
}
.self-view .no-feed {
    width: 128px; height: 128px;
    display: flex; align-items: center; justify-content: center;
    color: var(--eg-dim); font-size: 10px;
    font-family: var(--eg-mono);
    border: 1px solid var(--eg-border);
    border-radius: 8px;
}

/* ── 3D viewport ────────────────────────────────────── */
#viewport {
    position: fixed;
    top: 54px; left: 0; right: 0; bottom: 0;
}

/* ── Guide panel (right side) ──────────────────────── */
#guide-panel {
    position: fixed; top: 66px; right: 16px;
    width: 260px;
    max-height: calc(100vh - 86px);
    overflow-y: auto;
    background: var(--eg-panel-1);
    backdrop-filter: blur(8px);
    border: 1px solid var(--eg-border);
    border-radius: 12px;
    padding: 12px;
    z-index: 90;
    font-size: 12px;
}
#guide-panel::-webkit-scrollbar { width: 4px; }
#guide-panel::-webkit-scrollbar-thumb { background: rgba(120,160,225,0.18); border-radius: 2px; }

.guide-section { margin-bottom: 10px; }
.guide-section-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--eg-accent);
    font-family: var(--eg-mono);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--eg-border);
}

.guide-btn-row {
    display: flex; flex-wrap: wrap; gap: 4px;
}
.guide-btn {
    background: var(--eg-panel-1);
    border: 1px solid var(--eg-border);
    border-radius: 8px;
    color: var(--eg-text);
    font-family: var(--eg-mono);
    font-size: 10px;
    padding: 4px 8px;
    cursor: pointer;
    transition: all 0.15s;
}
.guide-btn:hover { background: rgba(255,255,255,0.12); border-color: var(--eg-accent); }
.guide-btn:active { transform: scale(0.95); }
.guide-btn.preset { border-color: rgba(139,92,246,0.4); color: #a78bfa; }
.guide-btn.preset:hover { background: rgba(139,92,246,0.15); }
.guide-btn.push { border-color: rgba(245,158,11,0.4); color: #fbbf24; }
.guide-btn.push:hover { background: rgba(245,158,11,0.15); }
.guide-btn.reward-good { border-color: rgba(56,217,122,0.4); color: #38d97a; }
.guide-btn.reward-good:hover { background: rgba(56,217,122,0.15); }
.guide-btn.reward-bad { border-color: rgba(239,68,68,0.4); color: #ef4444; }
.guide-btn.reward-bad:hover { background: rgba(239,68,68,0.15); }
.guide-btn.reset-btn {
    width: 100%; margin-top: 6px;
    border-color: rgba(107,124,147,0.4);
    color: #6b7c93;
    padding: 6px;
}

.guide-sliders { display: flex; flex-direction: column; gap: 4px; }
.slider-row {
    display: flex; align-items: center; gap: 6px;
}
.slider-label {
    width: 70px; font-size: 10px; color: var(--eg-dim);
    font-family: var(--eg-mono);
    text-transform: capitalize; flex-shrink: 0;
}
.slider-input {
    flex: 1; height: 4px;
    -webkit-appearance: none; appearance: none;
    background: rgba(255,255,255,0.1);
    border-radius: 2px; outline: none;
}
.slider-input::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px;
    background: var(--eg-accent); border-radius: 50%;
    cursor: pointer;
}
.slider-val {
    width: 28px; text-align: right;
    font-size: 10px; color: var(--eg-accent);
    font-family: var(--eg-mono);
}

/* ── Mobile responsive ─────────────────────────────── */
@media (max-width: 768px) {
    body {
        overflow-y: auto;
        height: auto;
        -webkit-overflow-scrolling: touch;
    }

    .eg-topbar {
        position: sticky;
        top: 0;
        padding: 0 12px;
        gap: 10px;
    }

    #viewport {
        position: relative;
        top: auto; left: auto; right: auto; bottom: auto;
        width: 100%;
        height: 50vh;
    }

    .hud {
        position: relative;
        top: auto; left: auto;
        width: 100%;
        border-radius: 0;
        padding: 10px 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        align-items: center;
        line-height: 1.4;
        -webkit-overflow-scrolling: touch;
    }
    .hud > div { white-space: nowrap; }
    .hud .divider {
        display: none;
    }
    .hud > div:last-child {
        width: 100%;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 4px;
    }

    #guide-panel {
        position: relative;
        top: auto; right: auto;
        width: 100%;
        max-height: none;
        border-radius: 0;
        padding: 12px;
        -webkit-overflow-scrolling: touch;
    }

    .legend {
        position: relative;
        bottom: auto; left: auto;
        width: 100%;
        border-radius: 0;
        justify-content: center;
        flex-wrap: wrap;
        padding: 10px 12px;
    }

    .self-view {
        position: relative;
        bottom: auto; right: auto;
        width: 100%;
        border-radius: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 12px;
    }
    .self-view canvas {
        width: 96px; height: 96px;
    }
    .self-view .no-feed {
        width: 96px; height: 96px;
    }

    .pulse-btn,
    .guide-btn {
        min-height: 44px;
        padding: 8px 12px;
        font-size: 12px;
        touch-action: manipulation;
    }
    .guide-btn.reset-btn {
        min-height: 44px;
        padding: 10px;
        touch-action: manipulation;
    }

    .slider-input {
        height: 8px;
        touch-action: manipulation;
    }
    .slider-input::-webkit-slider-thumb {
        width: 22px; height: 22px;
    }
}
</style>

<style>
/* ── Professional docked 3-column layout ───────────────────────────── */
.stage-grid{position:fixed;inset:54px 0 0 0;display:grid;grid-template-columns:286px minmax(0,1fr) 296px;z-index:1}
.rail{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,var(--eg-panel-1),transparent 60%)}
.rail-left{border-right:1px solid var(--eg-border)}
.rail-right{border-left:1px solid var(--eg-border)}
.center{position:relative;min-width:0;overflow:hidden;background:#05080f}
#viewport{position:absolute !important;top:0 !important;left:0 !important;right:0 !important;bottom:0 !important;width:100% !important;height:100% !important}
/* dock the floating panels into the rails (neutralise their fixed positions) */
.rail .hud,.rail .legend,.rail #guide-panel,.rail .self-view{position:static !important;top:auto !important;left:auto !important;right:auto !important;bottom:auto !important;width:auto !important;max-width:none !important;max-height:none !important;margin:0 !important;backdrop-filter:none !important}
.rail #guide-panel{flex:1 1 auto;min-height:0}
.rail .legend{display:flex;flex-wrap:wrap;gap:10px 14px}
.rail .self-view{align-self:stretch;text-align:center}
@media (max-width:1000px){

  .stage-grid{position:static;inset:auto;grid-template-columns:1fr;height:auto}
  .rail{overflow:visible}
  .center{height:60vh;min-height:420px}
}
</style>

<script type="module">
import { BodyScene } from './body-scene.js';
import { BodyData } from './body-data.js';
import { BodyGuide } from './body-guide.js';

// Detect dashboard URL
const params = new URLSearchParams(window.location.search);
const host = params.get('host') || window.location.hostname || 'localhost';
const isProxied = host === 'demo.engram.ai';
const port = params.get('port') || window.location.port || (isProxied ? '' : '8080');
const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
const portSuffix = port ? `:${port}` : '';
const wsUrl = params.get('ws') || `${proto}//${host}${portSuffix}/ws`;
const apiBase = params.get('api') || `${window.location.protocol}//${host}${portSuffix}`;

// HUD elements
const hudStatus   = document.getElementById('hud-status');
const hudChannel  = document.getElementById('hud-channel');
const hudOutcome  = document.getElementById('hud-outcome');
const hudHeight   = document.getElementById('hud-height');
const hudContacts = document.getElementById('hud-contacts');
const hudSimtime  = document.getElementById('hud-simtime');
const hudFrames   = document.getElementById('hud-frames');

// Init scene
const viewport = document.getElementById('viewport');
const scene = new BodyScene(viewport);

// Init data bridge
const data = new BodyData();

data.onTestPulse = ({ channel, success }) => {
    scene.applyTestPose(channel, success);
};

data.onUpdate = (state) => {
    if (state.bodies) scene.updateBodies(state.bodies, state.activeChannel, state.success);
    // Motor activation overlay — color joints by velocity-derived channel intensity
    if (state.motorRates) scene.updateMotorActivation(state.motorRates);

    // Update HUD
    const ch = state.activeChannel || '--';
    const chClass = state.activeChannel ? `channel-${state.activeChannel}` : '';
    hudChannel.className = 'value ' + chClass;
    hudChannel.textContent = ch;
    hudOutcome.textContent = state.activeChannel
        ? (state.success ? 'SUCCESS' : 'FAIL')
        : '--';
    hudOutcome.style.color = state.activeChannel
        ? (state.success ? '#38d97a' : '#ef4444')
        : '#22d3ee';
    hudHeight.textContent = state.torsoHeight.toFixed(3) + ' m';
    hudContacts.textContent = state.numContacts;
    hudSimtime.textContent = state.simTime.toFixed(1) + ' s';
    hudFrames.textContent = state.liveCount;
};

data.onStatus = (status) => {
    const dotClass = status.mode;
    const labels = { live: 'live', simulated: 'idle sim', idle: 'disconnected' };
    const label = labels[status.mode] || status.mode;
    hudStatus.innerHTML = `<span class="status-dot ${dotClass}"></span>${label}`;
};

// Pulse buttons — simulate a motor command locally for testing
document.querySelectorAll('.pulse-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        data.sendTestPulse(btn.dataset.ch);
    });
});

// Init guide panel — sends commands via WS or REST fallback
const guidePanel = document.getElementById('guide-panel');
const guide = new BodyGuide(guidePanel, (cmdData) => {
    // Try WebSocket first, fall back to REST
    if (data._ws && data._ws.readyState === WebSocket.OPEN) {
        data._ws.send(JSON.stringify({ type: 'mujoco_guide', data: cmdData }));
    } else {
        fetch(apiBase + '/api/mujoco/guide', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(cmdData),
        }).catch(e => console.warn('Guide REST fallback failed:', e));
    }
});

// Instant client-side preview when guide buttons are pressed
guide.onPreview = (channel) => {
    data.pauseSim(15000);  // hold preview for 15s (server response may take ~10s)
    scene.applyTestPose(channel, true);
    // Update HUD to reflect the preview
    hudChannel.textContent = channel;
    hudChannel.className = 'value channel-' + channel;
    hudOutcome.textContent = 'PREVIEW';
    hudOutcome.style.color = '#a78bfa';
};

// Self-view canvas — shows what the brain's body camera sees (64x64 grayscale)
const selfViewCanvas = document.getElementById('self-view-canvas');
const selfViewCtx = selfViewCanvas.getContext('2d');
const selfViewPlaceholder = document.getElementById('self-view-placeholder');

data.onSelfView = ({ pixels, width, height }) => {
    // Show canvas, hide placeholder on first frame
    if (selfViewPlaceholder.style.display !== 'none') {
        selfViewPlaceholder.style.display = 'none';
        selfViewCanvas.style.display = 'block';
    }
    // Draw grayscale pixels onto 128x128 canvas (2x upscale, pixelated via CSS)
    const imgData = selfViewCtx.createImageData(width, height);
    for (let i = 0; i < pixels.length; i++) {
        const v = pixels[i];
        imgData.data[i * 4]     = v;  // R
        imgData.data[i * 4 + 1] = v;  // G
        imgData.data[i * 4 + 2] = v;  // B
        imgData.data[i * 4 + 3] = 255; // A
    }
    // Draw at native 64x64 then CSS scales to 128x128 with pixelated rendering
    selfViewCanvas.width = width;
    selfViewCanvas.height = height;
    selfViewCtx.putImageData(imgData, 0, 0);
};

// Start
(async () => {
    await data.start(wsUrl, apiBase);
    // Always build the robot — use live geometry if available, otherwise procedural
    scene.setModelGeometry(data.getModelGeoms() || []);
    // Start guide (fetches joint info from API)
    guide.start(apiBase);
})();
</script>
