<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engram Brain — Live Neural Activity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
:root{
  --eg-bg:#070b15;
  --eg-text:#cdd6e6; --eg-dim:#7a8699; --eg-faint:#525d70; --eg-bright:#eef2fb;
  --eg-border:rgba(120,160,225,0.12); --eg-border-2:rgba(120,160,225,0.22);
  --eg-panel-1:rgba(148,178,225,0.05); --eg-panel-2:rgba(148,178,225,0.012);
  --eg-sans:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --eg-mono:'JetBrains Mono','SF Mono', ui-monospace, monospace;
  --eg-accent:#5ea4f5;
}
body{
  font-family:var(--eg-sans); color:var(--eg-text);
  background:
    radial-gradient(1000px 560px at 18% -6%, rgba(36,92,170,0.16), transparent 60%),
    radial-gradient(760px 460px at 100% 8%, rgba(124,92,222,0.10), transparent 60%),
    var(--eg-bg) !important;
  background-attachment:fixed;
}
.eg-topbar{position:fixed;inset:0 0 auto 0;height:54px;z-index:9000;display:flex;align-items:center;gap:14px;padding:0 18px;background:rgba(8,12,22,0.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--eg-border);font-family:var(--eg-mono)}
.eg-topbar a{text-decoration:none}
.eg-back{display:inline-flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.05em;color:var(--eg-dim);transition:color .2s}
.eg-back:hover{color:var(--eg-bright)}
.eg-brandwrap{display:flex;align-items:center;gap:9px;font-size:12.5px;letter-spacing:.07em}
.eg-mark{width:22px;height:22px;flex:none}
.eg-name{font-weight:700;background:linear-gradient(100deg,#5fe0f5,#7db4ff,#b79cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.eg-sep{color:var(--eg-faint)}
.eg-page{color:var(--eg-accent)}
.eg-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:11px;letter-spacing:.05em}
.eg-right a{color:var(--eg-dim);transition:color .2s}
.eg-right a:hover{color:#7db4ff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(120,160,225,0.18);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
    </style>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        canvas { display: block; }

        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 66px; left: 20px;
            pointer-events: none;
            z-index: 10;
            padding: 14px 16px;
            background: var(--eg-panel-1);
            border: 1px solid var(--eg-border);
            border-radius: 12px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        #hud.hidden { display: none; }
        .hud-title {
            font-family: var(--eg-sans);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--eg-bright);
            margin-bottom: 10px;
        }
        .hud-stat {
            font-size: 12px;
            color: var(--eg-dim);
            margin-bottom: 4px;
            font-family: var(--eg-mono);
            letter-spacing: 0.04em;
        }
        .hud-stat .val {
            color: var(--eg-accent);
            font-weight: 500;
        }
        .hud-phase {
            display: inline-block;
            margin-top: 8px;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .hud-phase.infant { background: rgba(244,114,182,0.2); color: #f472b6; }
        .hud-phase.toddler { background: rgba(34,211,238,0.2); color: #22d3ee; }
        .hud-phase.juvenile { background: rgba(56,217,122,0.2); color: #38d97a; }
        .hud-phase.adolescent { background: rgba(245,166,35,0.2); color: #f5a623; }
        .hud-phase.mature { background: rgba(94,164,245,0.2); color: #5ea4f5; }

        /* Neuromodulator mini-bars */
        .neuromod-hud {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }
        .nm-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .nm-label {
            font-size: 9px;
            color: var(--eg-dim);
            letter-spacing: 0.5px;
            font-family: var(--eg-mono);
            text-transform: uppercase;
        }
        .nm-track {
            width: 4px;
            height: 40px;
            background: rgba(255,255,255,0.05);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }
        .nm-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            border-radius: 2px;
            transition: height 0.8s ease;
        }
        .nm-fill.da { background: #f5a623; }
        .nm-fill.ach { background: #22d3ee; }
        .nm-fill.ne { background: #f44; }
        .nm-fill.sht { background: #a78bfa; }

        /* Connection status toggle button */
        #connection-status {
            position: absolute;
            top: 66px; right: 20px;
            font-size: 11px;
            letter-spacing: 0.05em;
            padding: 5px 12px;
            border-radius: 10px;
            z-index: 10;
            font-family: var(--eg-mono);
            cursor: pointer;
            pointer-events: auto;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #connection-status:hover {
            filter: brightness(1.3);
            border-color: var(--eg-accent);
        }
        #connection-status .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        #connection-status.status-live {
            background: rgba(56,217,122,0.15);
            color: #38d97a;
        }
        #connection-status.status-live .status-dot { background: #38d97a; }
        #connection-status.status-simulated {
            background: rgba(245,166,35,0.15);
            color: #f5a623;
        }
        #connection-status.status-simulated .status-dot { background: #f5a623; }
        #connection-status.status-connecting {
            background: rgba(94,164,245,0.15);
            color: #5ea4f5;
        }
        #connection-status.status-connecting .status-dot { background: #5ea4f5; animation: pulse 1s infinite; }
        #connection-status.status-disconnected {
            background: rgba(244,63,63,0.15);
            color: #f44;
        }
        #connection-status.status-disconnected .status-dot { background: #f44; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Region labels */
        .region-label {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            font-size: 10px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            color: rgba(200, 208, 224, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(10, 14, 26, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(94, 164, 245, 0.1);
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            transition: color 0.3s, background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .region-label:hover {
            color: #fff;
            background: rgba(10, 14, 26, 0.85);
            border-color: rgba(94, 164, 245, 0.4);
            box-shadow: 0 0 12px rgba(94, 164, 245, 0.2);
            z-index: 100;
        }
        .region-label.active {
            color: rgba(220, 228, 240, 0.95);
            background: rgba(10, 14, 26, 0.75);
            border-color: rgba(94, 164, 245, 0.25);
            text-shadow: 0 0 6px rgba(94, 164, 245, 0.4), 0 1px 3px rgba(0,0,0,0.8);
        }
        .region-label .rate {
            font-size: 8px;
            color: rgba(94, 164, 245, 0.7);
            margin-left: 4px;
            font-weight: 600;
        }

        /* Hover tooltip */
        .region-tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            width: 260px;
            padding: 12px 14px;
            background: rgba(10, 14, 26, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(94, 164, 245, 0.25);
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 16px rgba(94, 164, 245, 0.1);
            pointer-events: none;
            z-index: 200;
            white-space: normal;
            text-transform: none;
            letter-spacing: 0;
        }
        .region-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: rgba(94, 164, 245, 0.25);
        }
        .region-tooltip.flipped::after {
            top: auto;
            bottom: 100%;
            border-top-color: transparent;
            border-bottom-color: rgba(94, 164, 245, 0.25);
        }
        .region-label:hover .region-tooltip {
            display: block;
        }
        .region-tooltip .tt-name {
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .region-tooltip .tt-neurons {
            font-size: 10px;
            color: rgba(94, 164, 245, 0.8);
            margin-bottom: 6px;
        }
        .region-tooltip .tt-desc {
            font-size: 11px;
            color: rgba(200, 208, 224, 0.85);
            line-height: 1.5;
        }
        .region-tooltip .tt-connections {
            margin-top: 6px;
            font-size: 9px;
            color: rgba(200, 208, 224, 0.5);
        }
        /* Mobile responsive */
        @media (max-width: 768px) {
            .region-label {
                font-size: 8px;
                padding: 2px 5px;
                letter-spacing: 0.5px;
                touch-action: manipulation;
            }
            .region-label .rate {
                font-size: 7px;
            }
            .region-tooltip {
                width: 200px;
                padding: 8px 10px;
            }
            .region-tooltip .tt-name {
                font-size: 10px;
            }
            .region-tooltip .tt-desc {
                font-size: 9px;
            }
            #hud {
                top: 64px;
                left: 12px;
            }
            .hud-title {
                font-size: 12px;
                letter-spacing: 1px;
            }
            .hud-stat {
                font-size: 10px;
            }
            .nm-track {
                height: 30px;
            }
            #connection-status {
                top: 64px;
                right: 12px;
                font-size: 10px;
                padding: 4px 8px;
                touch-action: manipulation;
            }
        }
    </style>
</head>
<body>
    <header class="eg-topbar">
      <a class="eg-back" href="demos/index.html">&larr; Demos</a>
      <div class="eg-brandwrap">
        <svg class="eg-mark" viewBox="0 0 240 240" aria-hidden="true">
          <defs>
            <linearGradient id="egm-e" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#5ea4f5"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
            <radialGradient id="egm-n" cx="0.5" cy="0.38" r="0.65"><stop offset="0" stop-color="#daf6ff"/><stop offset="1" stop-color="#22d3ee"/></radialGradient>
            <radialGradient id="egm-f" cx="0.5" cy="0.38" r="0.65"><stop offset="0" stop-color="#e9fff2"/><stop offset="1" stop-color="#38d97a"/></radialGradient>
          </defs>
          <circle cx="120" cy="120" r="106" fill="none" stroke="url(#egm-e)" stroke-width="4" opacity="0.5"/>
          <g stroke="url(#egm-e)" stroke-width="4" stroke-linecap="round" opacity="0.9">
            <line x1="120" y1="56" x2="171" y2="76"/><line x1="171" y1="76" x2="187" y2="122"/><line x1="187" y1="122" x2="162" y2="170"/><line x1="162" y1="170" x2="110" y2="184"/><line x1="110" y1="184" x2="64" y2="160"/><line x1="64" y1="160" x2="55" y2="102"/><line x1="55" y1="102" x2="120" y2="56"/><line x1="120" y1="56" x2="116" y2="108"/><line x1="116" y1="108" x2="150" y2="124"/><line x1="150" y1="124" x2="187" y2="122"/><line x1="116" y1="108" x2="96" y2="142"/><line x1="96" y1="142" x2="64" y2="160"/><line x1="150" y1="124" x2="137" y2="156"/><line x1="137" y1="156" x2="110" y2="184"/><line x1="96" y1="142" x2="137" y2="156"/><line x1="171" y1="76" x2="150" y2="124"/><line x1="55" y1="102" x2="116" y2="108"/><line x1="116" y1="108" x2="137" y2="156"/>
          </g>
          <g>
            <circle cx="120" cy="56" r="7" fill="url(#egm-n)"/><circle cx="187" cy="122" r="7" fill="url(#egm-n)"/><circle cx="64" cy="160" r="7" fill="url(#egm-n)"/><circle cx="55" cy="102" r="6" fill="url(#egm-n)"/><circle cx="116" cy="108" r="8" fill="url(#egm-n)"/><circle cx="171" cy="76" r="9" fill="url(#egm-f)"/><circle cx="110" cy="184" r="8" fill="url(#egm-f)"/><circle cx="150" cy="124" r="10" fill="url(#egm-f)"/>
          </g>
        </svg>
        <span class="eg-name">ENGRAM</span>
        <span class="eg-sep">/</span>
        <span class="eg-page">Live Brain</span>
      </div>
      <div class="eg-right"><a href="https://github.com/DPBG/Engram.AI" target="_blank" rel="noopener">GitHub</a></div>
    </header>
    <script>
      // When embedded (iframed by the demo pages with ?embed=true), hide this
      // top bar so it does not double up with the host page's own header.
      if (new URLSearchParams(location.search).get('embed') === 'true') {
        var _egTopbar = document.querySelector('.eg-topbar');
        if (_egTopbar) _egTopbar.style.display = 'none';
      }
    </script>

    <div id="canvas-container"></div>

    <div id="hud">
        <div class="hud-title">Engram Neural Activity</div>
        <div class="hud-stat">Neurons: <span class="val" id="hud-neurons">--</span></div>
        <div class="hud-stat">Synapses: <span class="val" id="hud-synapses">--</span></div>
        <div class="hud-stat">Step: <span class="val" id="hud-step">--</span></div>
        <div class="hud-stat">Rate: <span class="val" id="hud-rate">--</span> steps/sec</div>
        <div id="hud-phase-container">
            <span class="hud-phase juvenile" id="hud-phase">--</span>
        </div>
        <div class="neuromod-hud">
            <div class="nm-bar">
                <div class="nm-track"><div class="nm-fill da" id="nm-da" style="height:40%"></div></div>
                <span class="nm-label">DA</span>
            </div>
            <div class="nm-bar">
                <div class="nm-track"><div class="nm-fill ach" id="nm-ach" style="height:40%"></div></div>
                <span class="nm-label">ACh</span>
            </div>
            <div class="nm-bar">
                <div class="nm-track"><div class="nm-fill ne" id="nm-ne" style="height:40%"></div></div>
                <span class="nm-label">NE</span>
            </div>
            <div class="nm-bar">
                <div class="nm-track"><div class="nm-fill sht" id="nm-sht" style="height:40%"></div></div>
                <span class="nm-label">5HT</span>
            </div>
        </div>
    </div>

    <div id="connection-status" class="status-connecting" title="Click to toggle Live / Simulated">
        <span class="status-dot"></span>
        <span class="status-text">CONNECTING...</span>
    </div>

    <!-- Three.js is loaded from a CDN. The repo's .gitignore excludes lib/, so the
         vendored ./lib/*.js files are absent on a fresh clone; the CDN prefix
         mapping resolves "three" and all "three/addons/..." imports. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
        }
    }
    </script>

    <script type="module" src="./brain-scene.js?v=6"></script>
</body>
</html>
